<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUTUBE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #181818;
            color: #fff;
        }

        header {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #202020;
        }

        header img {
            height: 30px;
            margin-right: 20px;
        }




        .categories {
            display: flex;
            overflow-x: auto;
            background-color: #202020;
            padding: 10px;
        }

        .categories button {
            background: #303030;
            color: #fff;
            border: none;
            padding: 8px 12px;
            margin-right: 8px;
            border-radius: 20px;
            cursor: pointer;
        }

        .video-grid {

            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
            padding: 20px;
        }

        .video-card {
            background-color: #202020;
            border-radius: 8px;
            overflow: hidden;
            display: inline-block;
            margin-top: 20px;

        }

        .video-card img {
            width: 100%;
            display: block;
            height: 250px;
        }

        .video-card h3 {
            margin: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <header>
        <img src="https://www.clipartmax.com/png/middle/322-3221244_square-youtube-logo-png.png" alt="YouTube Logo"
            style="width: 100px; height: 50px; border-radius: 20px;">
        <div class="search-bar" style="position: relative;">
            <input style="width: 947px;height: 50px; border-radius: 10px;position: absolute;left: 82px;top: -26px;"
                type="text" placeholder="Search">
            <i style="color: white; margin-left: 230px;position: absolute;right: -1080px;top: -5px;"
                class="fa-solid fa-microphone"></i>
            <i style="color: white; position: absolute;left: 1140px;top: -5px;" class="fa-solid fa-circle-plus"></i>
            <i style="color: white;position: absolute;left: 1190px;top: -5px;" class="fa-solid fa-bell"></i>
        </div>
        <img src="https://png.pngtree.com/png-vector/20191110/ourmid/pngtree-avatar-icon-profile-icon-member-login-vector-isolated-png-image_1978396.jpg"
            alt="Profile" style="height:30px; border-radius: 20px;position: absolute;left: 1410px;top: 20px;">
    </header>
    <div class="categories">
        <button>All</button>
        <button>Masala films</button>
        <button>News</button>
        <button>Dramedy</button>
        <button>Action Thrillers</button>
        <button>Smartphones</button>
        <button>Recently uploaded</button>
        <button>Watched</button>
        <button>New</button>
    </div>

    <div style="display: flex;">
        <div class="icons" style="background-color:  #181818;height: 80vh;width: 100px;">

            <i style="color: white;font-size: 30px;margin-top: 50px;" class="fa-solid fa-bars"></i>
            <p>SETTINGS</p>
            <i style="color: white;font-size: 30px;" class="fa-solid fa-house"></i>
            <p>HOME</p>
            <i style="color: white;font-size: 30px;" class="fa-solid fa-play"></i>
            <p>SHORTS</p>
            <i style="color: white;font-size: 30px;" class="fa-solid fa-square-rss"></i>
            <p>SUBCRIPITION</p>
        </div>


        <div class="video-grid">
            <div class="video-card">
                <img src="https://resource.flexclip.com/templates/cover/w400/space-war-aliens-spacecraft-universe-future-tech-movie-trailer-coming-soon-poster-intro.webp?v=1.1.4.3.3"
                    alt="Ad">
                <h3>Sponsored: universe future</h3>
            </div>
            <div class="video-card">
                <img src="https://i.ytimg.com/vi/ar_2lB4Xrjs/maxresdefault.jpg" alt="surya movies">
                <h3>latest movie </h3>
            </div>
            <div class="video-card">
                <img src="https://i.ytimg.com/vi/ynsbj3LgTpg/hqdefault.jpg" alt="Comedy Movie">
                <h3>New Malayalam Comedy Movies</h3>
            </div>
            <div class="video-card">
                <img src="https://d16f573ilcot6q.cloudfront.net/wp-content/uploads/2024/12/GeoLKlFXsAANler-1-scaled.webp"
                    alt="bgmi">
                <h3> battle ground moblie of india</h3>

            </div>
            <div class="video-card">
                <img src="https://i.ytimg.com/vi/DS-raAyMxl4/maxresdefault.jpg" alt="sanam re">
                <h3>old romatic song</h3>

            </div>
            <div>
                <div class="video-card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9dneJXahpmJAXJo7GGZYR4SeygFwTEr5enw&s" alt="asmr">
                    <h3>asmr</h3>
                </div>
            </div>
        </div>
</body>

</html>
